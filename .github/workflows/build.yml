name: Build & Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build renders

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime: continue
              for d in devices:
                  n = d["name"]
                  if not n.startswith("iPhone"): continue
                  score = (ver(runtime), "Pro Max" in n, "Pro" in n)
                  if best is None or score > best[0]: best = (score, d["udid"], n, runtime)
          if best is None: sys.exit("No iPhone simulator available")
          print(best[1]); print(best[2], best[3], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit & UI tests (simulator)
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          TEST_RUNNER_RENDER_DIR="$PWD/renders" xcodebuild test \
            -project Murzik.xcodeproj -scheme Murzik \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tests.xcresult \
            2>&1 | tee build/test.log | grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build/test.log

      - name: Test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path build/Tests.xcresult > build/test-summary.json 2>&1 || true
          xcrun xcresulttool get test-results tests --path build/Tests.xcresult > build/test-details.json 2>&1 || true
          grep -E "error:|warning:.*\.swift|Test Case|Executed|\*\* (TEST|BUILD)" build/test.log > build/test-digest.txt || true
          tail -n 40 build/test.log > build/test-tail.txt || true

      - name: Build unsigned IPA (device)
        id: ipa
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project Murzik.xcodeproj -scheme Murzik -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/ipa.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build/ipa.log
          APP=build/dd/Build/Products/Release-iphoneos/Murzik.app
          ls "$APP/PlugIns"
          plutil -p "$APP/Info.plist" | grep -E "NSSupportsLiveActivities|CFBundleIdentifier|MinimumOSVersion"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Murzik.ipa Payload)
          ls -la build/Murzik.ipa

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: murzik-${{ github.run_number }}
          path: |
            build/Murzik.ipa
            renders/
            build/*.log
            build/*.json
            build/*.txt

      - name: Publish CI output branch
        if: always()
        run: |
          git config user.name "murzik-ci"
          git config user.email "murzik-ci@users.noreply.github.com"
          git worktree add --detach ../out
          cd ../out
          if git ls-remote --exit-code origin ci-output >/dev/null; then
            git fetch -q origin ci-output && git checkout -q -B ci-output FETCH_HEAD
          else
            git checkout -q --orphan ci-output && git rm -rfq . || true
          fi
          rm -rf renders logs && mkdir -p renders logs
          cp "$GITHUB_WORKSPACE"/renders/*.png renders/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/build/*.txt "$GITHUB_WORKSPACE"/build/*.json logs/ 2>/dev/null || true
          grep -E "error:" -A3 "$GITHUB_WORKSPACE"/build/ipa.log > logs/ipa-errors.txt 2>/dev/null || true
          grep -E "error:" -A3 "$GITHUB_WORKSPACE"/build/test.log > logs/test-errors.txt 2>/dev/null || true
          printf "commit=%s\ntest=%s\nipa=%s\nrun=%s\n" "$GITHUB_SHA" "${{ steps.test.outcome }}" "${{ steps.ipa.outcome }}" "$GITHUB_RUN_ID" > logs/status.txt
          git add -A
          git commit -qm "CI output for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})" || true
          git push -q origin ci-output || echo "::warning::could not push ci-output"

      - name: Publish release
        if: steps.ipa.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/Murzik.ipa \
            --title "Murzik (build ${{ github.run_number }})" \
            --notes "Unsigned IPA. Install with Sideloadly (see README). Commit ${GITHUB_SHA::7}. Tests: ${{ steps.test.outcome }}." \
            --target "$GITHUB_SHA"

      - name: Fail if tests or build failed
        if: steps.test.outcome != 'success' || steps.ipa.outcome != 'success'
        run: exit 1
