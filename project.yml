name: Murzik
options:
  bundleIdPrefix: com.bogadin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: he

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Murzik:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: מורזיק
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he]
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bogadin.murzik
            CFBundleURLSchemes: [murzik]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bogadin.murzik
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MurzikWidgets

  MurzikWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: מורזיק
        CFBundleDevelopmentRegion: he
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bogadin.murzik.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES

  MurzikTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Murzik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bogadin.murzik.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Murzik.app/Murzik"
        BUNDLE_LOADER: "$(TEST_HOST)"

  MurzikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Murzik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bogadin.murzik.uitests
        TEST_TARGET_NAME: Murzik

schemes:
  Murzik:
    build:
      targets:
        Murzik: all
        MurzikTests: [test]
        MurzikUITests: [test]
    test:
      config: Debug
      targets:
        - MurzikTests
        - MurzikUITests
